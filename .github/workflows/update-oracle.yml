name: Update Grid Oracle Telemetry

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq python-dotenv

      - name: Run Telemetry Script (Update AI Knowledge)
        run: |
          cd backend/scripts
          python fetch_current_data.py

      - name: Run Frontend Update Script (Trigger AI)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd backend/scripts
          python update_frontend.py

      - name: Commit and Push New Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add frontend/src/data/calendar.json
          git add backend/data/current_data/
          
          git commit -m "TELEMETRY UPDATE: Processed latest F1 data and AI predictions" || echo "No new data to commit"
          git push